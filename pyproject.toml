[project]
name = "quant"
version = "0.1.0"
description = "Momentum investing strategy backtester"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "backtrader>=1.9.78.123",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "pyarrow>=17.0.0",
    "pyyaml>=6.0",
    "quantstats>=0.0.64",
    "requests>=2.32.0",
    "lxml>=5.0.0",
    "scipy>=1.15.3",
    "yfinance>=0.2.63",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[project.scripts]
momentum = "momentum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/momentum"]
