name: PR checks

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  pytest:
    name: Run full test suite
    if: startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'feature-')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run full test suite
        run: uv run pytest

  request-copilot-review:
    name: Request Copilot code review
    if: github.event.pull_request.draft == false && github.event.action != 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Request Copilot as a reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --add-reviewer @copilot
